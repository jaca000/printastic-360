name: Pesquisa diária de fornecedores
on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * *'
    - cron: '0 8 * * *'
permissions:
  contents: write
concurrency:
  group: printastic-supplier-edition
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Verificar hora de Lisboa
        id: timing
        env:
          CRON: ${{ github.event.schedule }}
        run: |
          offset=$(TZ=Europe/Lisbon date +%z)
          if [ -z "$CRON" ] || { [ "$offset" = +0100 ] && [ "$CRON" = '0 7 * * *' ]; } || { [ "$offset" = +0000 ] && [ "$CRON" = '0 8 * * *' ]; }; then
            echo 'due=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v4
        if: steps.timing.outputs.due == 'true'
      - name: Consultar os catálogos públicos
        if: steps.timing.outputs.due == 'true'
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install 'requests>=2.32,<3' 'beautifulsoup4>=4.12,<5'
          .venv/bin/python supplier-hunter.py
      - name: Publicar edição
        if: steps.timing.outputs.due == 'true'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- oportunidades-diarias.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Atualizar oportunidades diárias'
          git pull --rebase origin main
          git push origin HEAD:main
